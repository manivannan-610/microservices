spring.application.name=rating-data-service
server.port=8082
spring.datasource.url= jdbc:mysql://localhost:3306/microservice
spring.datasource.username= root
spring.datasource.password= root@123

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MariaDBDialect

spring.jpa.hibernate.ddl-auto = update

spring.jpa.show-sql=true


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Force registration with IP address instead of hostname
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Optional: expose management endpoints (health, etc.)
management.endpoints.web.exposure.include=*

