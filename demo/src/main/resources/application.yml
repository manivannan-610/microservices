server:
  port: 8081

spring:
  application:
    name: api-gateway
  security:
    user:
      name: "admin"
      password: "admin@123"

  cloud:
    gateway:
      routes:
        - id: movie-catalog
          uri: lb://movie-catalog-service
          predicates:
            - Path=/catalog/**

        - id: movie-info-service
          uri: lb://movie-info-service
          predicates:
            - Path=/movies/**

        - id: rating-data-service
          uri: lb://rating-data-service
          predicates:
            - Path=/ratingsData/**

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: "api-gateway:8081"

management:
  endpoints:
    web:
      exposure:
        include: "*"
#promethues for matrics
  endpoint:
    prometheus:
      access: unrestricted
  metrics:
    export:
      prometheus:
        enabled: true
#monitoring/tracking
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: http://localhost:4317
      transport: grpc

logging:
  file:
    name: logs/app.log
  level:
    org.springframework.cloud.gateway: DEBUG
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}]"