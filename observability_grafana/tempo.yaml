server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
        http:

ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

  trace_idle_period: 5s
  max_block_duration: 30s

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces